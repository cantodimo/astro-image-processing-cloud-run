name: Terraform-infra

on:
  push:
    branches:
      - dev
    paths:
      - "terraform/**"
      - ".github/workflows/create-infra.yml"

  pull_request:
    branches:
      - dev
    paths:
      - "terraform/**"
      - ".github/workflows/create-infra.yml"

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask GCP identifiers
        run: |
          echo "::add-mask::${{ vars.GCP_PROJECT_ID }}"
          echo "::add-mask::${{ vars.GCP_PROJECT_NUMBER }}"
          echo "::add-mask::${{ vars.GCP_SERVICE_ACCOUNT }}"
          echo "::add-mask::${{ vars.GCP_WIF_PROVIDER }}"
          echo "::add-mask::${{ vars.GCP_REGION }}"
          echo "::add-mask::${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}"
          echo "::add-mask::${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_artifact_registry_repository_id: ${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}

  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: gcp-infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask GCP identifiers
        run: |
          echo "::add-mask::${{ vars.GCP_PROJECT_ID }}"
          echo "::add-mask::${{ vars.GCP_PROJECT_NUMBER }}"
          echo "::add-mask::${{ vars.GCP_SERVICE_ACCOUNT }}"
          echo "::add-mask::${{ vars.GCP_WIF_PROVIDER }}"
          echo "::add-mask::${{ vars.GCP_REGION }}"
          echo "::add-mask::${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}"
          echo "::add-mask::${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/infra
        run: terraform init -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Terraform Apply
        working-directory: terraform/infra
        run: terraform apply -auto-approve
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_artifact_registry_repository_id: ${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}