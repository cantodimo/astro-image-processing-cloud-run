name: Terraform-infra

on:
  push:
    branches:
      - dev
    paths:
      - "terraform/**"
      - ".github/workflows/create-infra.yml"

  pull_request:
    branches:
      - dev
    paths:
      - "terraform/**"
      - ".github/workflows/create-infra.yml"

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_ARTIFACT_REGISTRY_REPO: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPO }}
      GCP_TERRAFORM_STATE_BUCKET: ${{ secrets.GCP_TERRAFORM_STATE_BUCKET }}

    defaults:
      run:
        working-directory: terraform/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=$GCP_TERRAFORM_STATE_BUCKET"

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_project_id: $GCP_PROJECT_ID
          TF_VAR_region: $GCP_REGION
          TF_VAR_artifact_registry_repository_id: $GCP_ARTIFACT_REGISTRY_REPO

  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: gcp-infrastructure

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_ARTIFACT_REGISTRY_REPO: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPO }}
      GCP_TERRAFORM_STATE_BUCKET: ${{ secrets.GCP_TERRAFORM_STATE_BUCKET }}

    defaults:
      run:
        working-directory: terraform/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=$GCP_TERRAFORM_STATE_BUCKET"

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_project_id: $GCP_PROJECT_ID
          TF_VAR_region: $GCP_REGION
          TF_VAR_artifact_registry_repository_id: $GCP_ARTIFACT_REGISTRY_REPO